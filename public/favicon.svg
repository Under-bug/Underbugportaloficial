<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Green Circle -->
  <circle cx="50" cy="50" r="43" stroke="#4ade80" stroke-width="4.5" />
  
  <!-- Left Concentric Dash Arc -->
  <path
    d="M31.2 43 A 25 25 0 0 0 31.2 57"
    stroke="#4ade80"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />
  
  <!-- Right Concentric Dash Arc -->
  <path
    d="M68.8 43 A 25 25 0 0 1 68.8 57"
    stroke="#4ade80"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />
  
  <!-- Bottom Concentric Dash Arc -->
  <path
    d="M43 74 A 25 25 0 0 0 57 74"
    stroke="#4ade80"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-dasharray="2.5 3.5"
    fill="none"
  />

  <!-- Head -->
  <circle cx="50" cy="30" r="4.5" fill="#4ade80" />
  
  <!-- Antennas -->
  <path
    d="M48 26 C43 23, 40 20, 42 16"
    stroke="#4ade80"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M52 26 C57 23, 60 20, 58 16"
    stroke="#4ade80"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Antenna Tips -->
  <circle cx="42" cy="15.5" r="1.5" fill="#4ade80" />
  <circle cx="58" cy="15.5" r="1.5" fill="#4ade80" />

  <!-- Wings / Shoulders -->
  <path
    d="M38 33 C38 33, 31 35, 33 44 C35 50, 43 45, 45 40 Z"
    fill="#4ade80"
  />
  <path
    d="M62 33 C62 33, 69 35, 67 44 C65 50, 57 45, 55 40 Z"
    fill="#4ade80"
  />

  <!-- Six Legs -->
  <!-- Leg Group 1 (Front) -->
  <path
    d="M35 38 Q24 38 22 45"
    stroke="#4ade80"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M65 38 Q76 38 78 45"
    stroke="#4ade80"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Leg Group 2 (Middle) -->
  <path
    d="M32 50 Q21 54 20 62"
    stroke="#4ade80"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M68 50 Q79 54 80 62"
    stroke="#4ade80"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Leg Group 3 (Back) -->
  <path
    d="M36 66 Q26 73 25 80"
    stroke="#4ade80"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M64 66 Q74 73 75 80"
    stroke="#4ade80"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Central Carapace Shell -->
  <path
    d="M50 36 C41 36, 38 48, 38 62 C38 73, 44 76, 50 78 C56 76, 62 73, 62 62 C62 48, 59 36, 50 36 Z"
    stroke="#4ade80"
    stroke-width="3.2"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Spine of central carapace -->
  <line x1="50" y1="36" x2="50" y2="78" stroke="#4ade80" stroke-width="2.6" />
  
  <!-- Horizontal intersection divider -->
  <path d="M38 56 Q50 63 62 56" stroke="#4ade80" stroke-width="2.6" fill="none" />

  <!-- 4 Inside Nuclei/Segments (Leaf clover representation) -->
  <path d="M44 48 C44 48, 47 43, 49 48 C49 48, 46 53, 44 48 Z" fill="#4ade80" />
  <path d="M56 48 C56 48, 53 43, 51 48 C51 48, 54 53, 56 48 Z" fill="#4ade80" />
  <path d="M44 64 C44 64, 47 69, 49 64 C49 64, 46 59, 44 64 Z" fill="#4ade80" />
  <path d="M56 64 C56 64, 53 69, 51 64 C51 64, 54 59, 56 64 Z" fill="#4ade80" />
</svg>
